name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout git repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Do not leave a write-scoped token in .git/config while npm ci runs
          # dependency lifecycle scripts. The publisher reads GITHUB_TOKEN from
          # the step environment instead.
          persist-credentials: false

      - name: Install Node and NPM
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and build
        run: npm ci

      - name: Refuse to publish an E2E build
        shell: bash
        run: test -z "${SAUGER_E2E:-}"

      - name: Typecheck
        run: npm run typecheck

      - name: Run check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
